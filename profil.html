<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 Dünya Kupası | Kullanıcı Profili</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
    <style>
        :root {
            --primary: #8A1538;
            --secondary: #bd9b60;
            --dark: #0f141e;
            --light: #f4f7f6;
            --white: #ffffff;
            --nav-height: 72px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(15,20,30,0.8), rgba(138,21,56,0.7)), 
                        url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2000') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: var(--dark);
            padding-top: var(--nav-height);
        }

        /* Profil Kartı */
        .profile-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - var(--nav-height));
            padding: 30px 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, #5c0e25 100%);
            color: white;
            padding: 35px 20px;
            text-align: center;
            position: relative;
        }

        .profile-img-circle {
            width: 90px;
            height: 90px;
            background: var(--secondary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0 auto 14px;
            border: 4px solid rgba(255,255,255,0.8);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .profile-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .profile-body {
            padding: 28px 24px;
        }

        .info-group {
            margin-bottom: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .info-label {
            font-size: 0.78rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.05rem;
            color: #1e293b;
            font-weight: 600;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-footer {
            display: flex;
            gap: 12px;
            padding: 0 24px 28px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .btn-home { 
            background: #f1f5f9; 
            color: #334155; 
            border: 1px solid #cbd5e1;
        }
        .btn-home:hover { 
            background: #e2e8f0; 
            color: #0f172a;
        }

        .btn-logout { 
            background: #e11d48; 
            color: white; 
        }
        .btn-logout:hover { 
            background: #be123c; 
        }

        .badge {
            background: var(--secondary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="profile-wrapper">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-img-circle" id="profile-initial">?</div>
                <h2 id="display-name">Kullanıcı</h2>
                <span class="badge" id="user-role">Turnuva Yöneticisi</span>
            </div>

            <div class="profile-body">
                <div class="info-group">
                    <div class="info-label">E-posta Adresi</div>
                    <div class="info-value" id="display-email">yukleniyor...</div>
                </div>
                <div class="info-group">
                    <div class="info-label">Kullanıcı Kimliği</div>
                    <div class="info-value" id="display-id">#1001</div>
                </div>
                <div class="info-group">
                    <div class="info-label">Hesap Türü</div>
                    <div class="info-value" id="display-type">Yönetici Hesabı</div>
                </div>
                <div class="info-group">
                    <div class="info-label">Sistem Bağlantısı</div>
                    <div class="info-value" style="color: #16a34a;">
                        <span style="font-size: 0.8rem;">🟢</span> Aktif ve Güvenli
                    </div>
                </div>
            </div>

            <div class="profile-footer">
                <a href="index.html" class="btn btn-home">ANA SAYFA</a>
                <button class="btn btn-logout" onclick="fifaCikisYap()">ÇIKIŞ YAP</button>
            </div>
        </div>
    </div>

    <script>
        function profilYukle() {
            const authStatus = localStorage.getItem('fifa_auth');
            const userDataStr = localStorage.getItem('fifa_user_data');
            const fifaUser = localStorage.getItem('fifa_user');

            if (!authStatus) {
                alert("Bu sayfayı görmek için giriş yapmalısınız.");
                window.location.replace('login.html');
                return;
            }

            let name = "Kullanıcı";
            let email = "bilgi@fifa2026.org";
            let id = "#1001";
            let role = "Turnuva Yöneticisi";

            if (authStatus === 'misafir') {
                name = "Misafir Kullanıcı";
                email = "misafir@fifa2026.org";
                id = "#GUEST-2026";
                role = "Misafir İzleyici";
            } else {
                if (userDataStr) {
                    try {
                        const u = JSON.parse(userDataStr);
                        name = u.name || u.username || fifaUser || "Yönetici";
                        email = u.email || (name.toLowerCase() + '@fifa2026.org');
                        id = "#" + (u.id || "1001");
                        role = u.role || "Turnuva Yöneticisi";
                    } catch(e) {}
                } else if (fifaUser) {
                    name = fifaUser;
                    email = fifaUser.toLowerCase() + '@fifa2026.org';
                }
            }

            document.getElementById('display-name').innerText = name;
            document.getElementById('display-email').innerText = email;
            document.getElementById('display-id').innerText = id;
            document.getElementById('user-role').innerText = role;
            document.getElementById('display-type').innerText = role;
            document.getElementById('profile-initial').innerText = name.charAt(0).toUpperCase();
        }

        function navbarYukle() {
            fetch('navbar.html')
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    const ph = document.getElementById('navbar-placeholder');
                    if (ph) {
                        ph.innerHTML = html;
                        const scripts = ph.querySelectorAll('script');
                        scripts.forEach(s => {
                            const newScript = document.createElement('script');
                            newScript.text = s.text;
                            document.body.appendChild(newScript);
                        });
                    }
                })
                .catch(() => {
                    const ph = document.getElementById('navbar-placeholder');
                    if (ph) ph.innerHTML = `
                        <header id="fifa-main-header">
                            <nav class="fifa-navbar">
                                <div class="fifa-logo"><a href="index.html">🏆 FIFA <span>2026</span></a></div>
                                <ul class="fifa-nav-links">
                                    <li><a href="index.html">Ana Sayfa</a></li>
                                    <li><a href="fikstur.html">Fikstür</a></li>
                                    <li><a href="takimlar.html">Takımlar</a></li>
                                    <li><a href="eleme.html">Eleme Ağacı</a></li>
                                    <li><a href="takvim.html">Turnuva Takvimi</a></li>
                                    <li><a href="profil.html" class="active">Profilim</a></li>
                                </ul>
                            </nav>
                        </header>`;
                });
        }

        function fifaCikisYap() {
            localStorage.clear();
            window.location.replace('login.html');
        }

        window.onload = () => {
            navbarYukle();
            profilYukle();
        };
    </script>
</body>
</html>
