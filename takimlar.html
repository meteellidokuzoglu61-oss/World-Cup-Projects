<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Kupası 2026 - Takımlar & Gruplar</title>
    
    <style>
        :root {
            --primary: #8A1538;
            --primary-dark: #5c0e25;
            --secondary: #bd9b60;
            --bg: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            background-image: 
                radial-gradient(at 0% 0%, rgba(138, 21, 56, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 77, 152, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
        }
        
        body.modal-open { overflow: hidden; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }

        /* MODERN HEADER */
        header {
            text-align: center; 
            padding: 60px 40px;
            background: linear-gradient(135deg, rgba(138, 21, 56, 0.8) 0%, rgba(0, 77, 152, 0.8) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            color: white; 
            border-radius: 24px; 
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        header h1 { font-size: 2.5em; margin: 0 0 10px 0; font-weight: 800; letter-spacing: 1px; }
        header p { font-size: 1.2em; color: #cbd5e1; margin: 0; font-weight: 300; }

        /* UYARLANMIŞ MODERN FİLTRE ALANI TASARIMI */
        .filtre-alani {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: -10px 0 35px 0;
            flex-wrap: wrap;
        }

        .filtre-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .filtre-btn:hover {
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(189, 155, 96, 0.15);
        }

        .filtre-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(138, 21, 56, 0.4);
        }

        /* GRUP BAŞLIKLARI VE GRIDLERİ */
        .grup-bolumu {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .grup-baslik {
            color: var(--secondary); 
            margin-top: 0;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary); 
            padding-left: 15px;
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .takim-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 20px; 
        }

        /* MODERN TAKIM KARTLARI */
        .takim-karti { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, border-color 0.3s;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .takim-karti:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(138, 21, 56, 0.2); 
            border-color: var(--secondary); 
            background: rgba(255, 255, 255, 0.1);
        }
        
        .bayrak { 
            width: 80px; 
            height: 53px; 
            border-radius: 6px; 
            object-fit: cover; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            transition: 0.3s;
        }
        .takim-karti:hover .bayrak { transform: scale(1.05); }
        .takim-karti strong { display: block; color: #fff; font-size: 1.05em; font-weight: 600; }

        /* MODERN MODAL */
        .modal {
            display: none; position: fixed; z-index: 9999; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(5, 8, 15, 0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow-y: auto; padding: 20px 0;
        }

        .modal-content {
            background: #151d30; margin: auto; width: 92%; max-width: 650px; 
            border-radius: 24px; overflow: hidden; position: relative;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: modalGiris 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes modalGiris { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .close-btn { 
            position: fixed; right: 25px; top: 20px; font-size: 45px; 
            color: #9ca3af; cursor: pointer; z-index: 10001; transition: 0.2s;
        }
        .close-btn:hover { color: #fff; transform: rotate(90deg); }

        .modal-header { 
            background: linear-gradient(135deg, var(--primary) 0%, #500b20 100%); 
            color: white; padding: 40px 20px; text-align: center; 
            border-bottom: 1px solid var(--card-border);
        }
        
        /* MODAL SEKMELERİ */
        .tab-menu { display: flex; background: #0f1626; border-bottom: 1px solid var(--card-border); }
        .tab-btn { 
            flex: 1; padding: 18px; border: none; cursor: pointer; 
            font-weight: 700; color: #9ca3af; background: none; transition: 0.3s;
            font-size: 0.95em; letter-spacing: 0.5px;
        }
        .tab-btn.active { color: var(--secondary); border-bottom: 4px solid var(--secondary); background: rgba(255,255,255,0.02); }
        
        .tab-content { display: none; padding: 30px 25px; color: #e5e7eb; }
        .tab-content.active { display: block; }

        /* İÇERİK ÖGELERİ */
        .stad-card { 
            margin-bottom: 25px; border-radius: 20px; overflow: hidden; 
            background: rgba(255,255,255,0.02); box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            border: 1px solid var(--card-border); 
        }
        .stad-img { width: 100%; height: 260px; display: block; object-fit: cover; transition: 0.5s; }
        .stad-card:hover .stad-img { transform: scale(1.04); }
        .stad-info { padding: 20px; font-weight: 700; font-size: 1.15em; color: var(--secondary); text-align: center; }

        .info-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--card-border); font-size: 1.05em; }
        .info-row strong { color: #9ca3af; font-weight: 500; }
        .info-row span { font-weight: 600; color: #fff; }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="container">
        <header>
            <h1>🏆 DÜNYA KUPASI 2026</h1>
            <p>Kuzey Amerika Yolculuğu Başlıyor</p>
        </header>

        <div class="filtre-alani">
            <button class="filtre-btn active" onclick="filtrele(event, 'HEPSİ')">Hepsi</button>
            <button class="filtre-btn" onclick="filtrele(event, 'UEFA')">UEFA</button>
            <button class="filtre-btn" onclick="filtrele(event, 'CONMEBOL')">CONMEBOL</button>
            <button class="filtre-btn" onclick="filtrele(event, 'CONCACAF')">CONCACAF</button>
            <button class="filtre-btn" onclick="filtrele(event, 'CAF')">CAF</button>
            <button class="filtre-btn" onclick="filtrele(event, 'AFC')">AFC</button>
            <button class="filtre-btn" onclick="filtrele(event, 'OFC')">OFC</button>
        </div>

        <div id="gruplar-konteynir"></div>
    </div>

    <div id="takimModal" class="modal">
        <span class="close-btn" onclick="modalKapat()">×</span>
        <div class="modal-content">
            <div id="modal-icerik"></div>
        </div>
    </div>

<script>
   const stadyumGorselleri = {
        "MetLife": "https://w0.peakpx.com/wallpaper/161/435/HD-wallpaper-metlife-stadium-aerial-view-nfl-new-york-giants-stadium-new-york-jets-stadium-soccer-american-football-stadium-usa-new-jersey-american-stadiums.jpg",
        "SoFi": "https://st5.depositphotos.com/60241456/77824/i/450/depositphotos_778241476-stock-photo-inglewood-usa-november-2024-sofi.jpg",
        "AT&T": "https://t4.ftcdn.net/jpg/05/49/05/97/360_F_549059713_s0ntRZTHF1yB2vkJHYbzOKR8ZbsOLJNf.jpg",
        "Azteca": "https://media.istockphoto.com/id/1023819902/tr/foto%C4%9Fraf/mexico-citydeki-aztek-stadyumunun-havadan-g%C3%B6r%C3%BCn%C3%BCm%C3%BC.jpg?s=612x612&w=0&k=20&c=WIdzJOo5XZcf2FyzKUJT2VMGHW2QNly9qEsx8MrFFFQ=",
        "BC Place": "https://w0.peakpx.com/wallpaper/930/909/HD-wallpaper-bc-place-vancouver-whitecaps-fc-stadium-canadian-football-stadium-vancouver-british-columbia-canada-mls-stadiums-major-league-soccer.jpg",
        "Lumen": "https://static.clubs.nfl.com/image/private/t_new_photo_album/seahawks/rb5xedis3xxtppyxbsds.jpg",
        "Mercedes-Benz": "https://cdn.mos.cms.futurecdn.net/QT7b7RtMfc7doghPBpNutJ.jpg",
        "Hard Rock": "https://t3.ftcdn.net/jpg/03/05/52/14/360_F_305521418_yzUq5q5pXDsIl3C4TpzIuVzW9klVg4pV.pV.jpg",
        "Arrowhead": "https://static.clubs.nfl.com/image/private/t_new_photo_album/chiefs/tr74gj3cjwaoe83qmy9k.jpg",
        "Levi's": "https://ww4.hdnux.com/photos/31/55/16/6738831/5/rawImage.jpg",
        "Lincoln": "https://wallpapercave.com/wp/wp11930816.jpg",
        "NRG Stadyumu": "https://media.istockphoto.com/id/2262548047/photo/aerial-view-of-nrg-stadium-and-downtown-houston-skyline-at-night.jpg?s=612x612&w=0&k=20&c=BZhqwyXYcFS2wVXqlCqJsVaAv_rempC0aLhLUO-XjcM=",
        "BMO": "https://w0.peakpx.com/wallpaper/105/530/HD-wallpaper-bmo-field-r-canadian-football-stadium-toronto-argonauts-stadium-aerial-view-canada-bmo-field-stadium-toronto.jpg",
        "BBVA": "https://w0.peakpx.com/wallpaper/837/626/HD-wallpaper-estadio-bbva-bancomer-the-steel-giant-guadalupe-nuevo-leon-mexico-cf-monterrey-stadium-mexican-football-stadiums-modern-sports-arenas-stadiums.jpg",
        "Akron": "https://w0.peakpx.com/wallpaper/154/234/HD-wallpaper-estadio-akron-zapopan-mexico-estadio-omnilife-estadio-chivas-club-deportivo-guadalajara-stadium-mexican-football-stadium.jpg",
        "Gillette Stadyumu": "https://images8.alphacoders.com/566/thumb-1920-566506.jpg"
    };

    const nisan2026Sira = { "ar": 2, "fr": 1, "es": 3, "gb-eng": 4, "br": 5, "pt": 6, "ma": 8, "tr": 22, "us": 14, "mx": 17, "ca": 28 };

    let tumTakimlar = [];

    async function veriyiGetir() {
        try {
            const [tRes, dRes] = await Promise.all([fetch('takimlar.json'), fetch('data.json')]);
            const takimlar = await tRes.json();
            const detaylar = await dRes.json();
            
            tumTakimlar = takimlar.map(t => ({ 
                ...t, 
                sira: nisan2026Sira[t.id] || t.sira, 
                grup: t.grup || "Belirsiz", 
                ...(detaylar[t.id] || {}) 
            }));
            
            sayfayiOlustur(tumTakimlar);
        } catch (e) { console.error("Veri yükleme hatası:", e); }
    }

    function sayfayiOlustur(takimlar) {
        const konteynir = document.getElementById('gruplar-konteynir');
        konteynir.innerHTML = "";

        if (takimlar.length === 0) {
            konteynir.innerHTML = `<div style="text-align:center; padding:50px; color:#9ca3af; font-size:1.1em;">Seçilen konfederasyonda takımların grupları henüz belli değil.</div>`;
            return;
        }

        const gruplar = [...new Set(takimlar.map(t => t.grup))].sort();

        gruplar.forEach(grup => {
            const grupTakimlari = takimlar.filter(t => t.grup === grup);
            
            if (grupTakimlari.length === 0) return;

            const section = document.createElement('div');
            section.className = 'grup-bolumu';
            const baslikMetni = grup.length === 1 ? `GRUP ${grup}` : grup;

            section.innerHTML = `
                <h2 class="grup-baslik">${baslikMetni}</h2>
                <div class="takim-grid" id="grup-${grup.replace(/\s/g, '')}"></div>
            `;
            konteynir.appendChild(section);
            
            const grid = document.getElementById(`grup-${grup.replace(/\s/g, '')}`);
            
            grupTakimlari.forEach(t => {
                const kart = document.createElement('div');
                kart.className = 'takim-karti';
                kart.onclick = () => detayAc(t);
                kart.innerHTML = `
                    <img src="https://flagcdn.com/w160/${t.id}.png" class="bayrak" alt="${t.ad}">
                    <div><strong>${t.ad}</strong></div>
                `;
                grid.appendChild(kart);
            });
        });
    }

    function filtrele(evt, konfederasyon) {
        const butonlar = document.querySelectorAll('.filtre-btn');
        butonlar.forEach(btn => btn.classList.remove('active'));
        evt.currentTarget.classList.add('active');

        if (konfederasyon === 'HEPSİ') {
            sayfayiOlustur(tumTakimlar);
        } else {
            const filtrelenmis = tumTakimlar.filter(t => t.fed && t.fed.toUpperCase() === konfederasyon.toUpperCase());
            sayfayiOlustur(filtrelenmis);
        }
    }

    async function vikipedidenKadroCek(takimAdi) {
        const sayfaAdi = "2026_FIFA_Dünya_Kupası_kadroları";
        const url = `https://tr.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(sayfaAdi)}&prop=text&format=json&origin=*`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.error) return "<div style='padding:20px; text-align:center;'>Kadro sayfası Vikipedi'de bulunamadı.</div>";

            const htmlIcerik = data.parse.text["*"];
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlIcerik, 'text/html');
            const basliklar = doc.querySelectorAll('h3, h4, .mw-heading3, .mw-heading4');
            let hedefBaslik = null;
            const temizle = (metin) => metin.toLocaleLowerCase('tr-TR').trim();
            const arananTakim = temizle(takimAdi);

            for (let baslik of basliklar) {
                if (baslik.id && (baslik.id.includes('Grup') || baslik.id.includes('Kadro'))) continue;
                const baslikText = temizle(baslik.textContent.replace('[değiştir]', ''));
                let ozelEslenme = false;
                if (arananTakim === "abd" && (baslikText.includes("amerika") || baslikText.includes("abd"))) ozelEslenme = true;
                if (arananTakim === "ingiltere" && baslikText.includes("ingiltere")) ozelEslenme = true;

                if (baslikText.includes(arananTakim) || arananTakim.includes(baslikText) || ozelEslenme) {
                    hedefBaslik = baslik;
                    break;
                }
            }

            if (!hedefBaslik) return `<div style='padding:20px; text-align:center;'>${takimAdi} takımı için bu sayfada henüz bir kadro başlığı açılmamış veya isim eşleşmedi.</div>`;

            let sonrakiEleman = hedefBaslik.nextElementSibling;
            let kadroTablosu = null;

            for (let i = 0; i < 5; i++) {
                if (!sonrakiEleman) break;
                if (sonrakiEleman.tagName === 'TABLE' && sonrakiEleman.classList.contains('wikitable')) {
                    kadroTablosu = sonrakiEleman;
                    break;
                }
                const icindekiTablo = sonrakiEleman.querySelector('table.wikitable');
                if (icindekiTablo) {
                    kadroTablosu = icindekiTablo;
                    break;
                }
                sonrakiEleman = sonrakiEleman.nextElementSibling;
            }

            if (!kadroTablosu) return `<div style='padding:20px; text-align:center;'>${takimAdi} başlığı bulundu fakat altındaki kadro tablosu okunamadı.</div>`;

            const temizTablo = kadroTablosu.cloneNode(true);
            temizTablo.querySelectorAll('.mw-editsection').forEach(el => el.remove());

            return `
            <div class="viki-kadro" style="overflow-x:auto; padding: 10px;">
                <style>
                    .viki-kadro table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: #1f293d; border-radius: 12px; overflow: hidden; }
                    .viki-kadro th { background-color: var(--primary) !important; color: white !important; padding: 12px 10px; text-align: left; }
                    .viki-kadro td { padding: 10px; border-bottom: 1px solid var(--card-border); color: #e5e7eb; }
                    .viki-kadro tr:hover { background-color: rgba(255,255,255,0.05); }
                    .viki-kadro a { color: var(--secondary); text-decoration: none; font-weight: 600; }
                    .viki-kadro td[style*="background"], th[style*="background"] { color: #ffffff !important; }
                </style>
                ${temizTablo.outerHTML}
            </div>`;
        } catch (error) {
            return "<div style='padding:20px; text-align:center; color:red;'>Kadro yüklenirken bir hata oluştu.</div>";
        }
    }

    async function detayAc(t) {
        const icerik = document.getElementById('modal-icerik');
        const hasStad = t.stadyumlar && t.stadyumlar.length > 0;

        icerik.innerHTML = `
            <div class="modal-header">
                <img src="https://flagcdn.com/w160/${t.id}.png" width="100" style="border:4px solid white; border-radius:10px; margin-bottom:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" alt="Bayrak">
                <h2 style="margin:0; letter-spacing:1px; font-weight:800;">${t.ad.toUpperCase()}</h2>
            </div>
            <div class="tab-menu">
                <button class="tab-btn active" onclick="tabDegistir(event, 'genel')">KÜNYE</button>
                ${hasStad ? `<button class="tab-btn" onclick="tabDegistir(event, 'stadlar')">STADYUMLAR</button>` : ''}
                <button class="tab-btn" onclick="tabDegistir(event, 'kadro')">KADRO</button>
            </div>
            
            <div id="genel" class="tab-content active">
                <div class="info-row"><strong>Grup</strong><span>Grup ${t.grup || '-'}</span></div>
                <div class="info-row"><strong>Konfederasyon</strong><span>${t.fed || '-'}</span></div>
                <div class="info-row"><strong>Teknik Direktör</strong><span>${t["Teknik Direktör"] || 'Belli Değil'}</span></div>
                <div class="info-row"><strong>FIFA Dünya Sırası</strong> <span>#${t.sira || '-'}</span></div>
                <div class="info-row"><strong>Takım Lakabı</strong> <span>${t.lakap || 'Yok'}</span></div>
            </div>
            
           <div id="stadlar" class="tab-content">
                ${(t.stadyumlar || []).map(s => {
                    if (!s.ad) return ''; 
                    const gelenStadAdi = s.ad.toLocaleLowerCase('tr-TR');
                    const stadKey = Object.keys(stadyumGorselleri).find(k => gelenStadAdi.includes(k.toLocaleLowerCase('tr-TR'))) || "";
                    const imgUrl = stadyumGorselleri[stadKey] || "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80";
                    const haritaLinki = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.ad + ' ' + (s.sehir || ''))}`;
                    
                    return `
                    <div class="stad-card">
                        <img src="${imgUrl}" class="stad-img" alt="${s.ad}">
                        <div class="stad-info">
                            ${s.ad} <br> 
                            <small style="color:#9ca3af; font-weight:normal; display:block; margin-bottom:12px;">${s.sehir || ''}</small>
                            <a href="${haritaLinki}" target="_blank" style="display: inline-block; padding: 8px 16px; background-color: #24a0ed; color: white !important; text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 8px; margin-top: 5px; transition: 0.2s; box-shadow: 0 4px 10px rgba(36,160,237,0.3);">
                                📍 Haritada Göster
                            </a>
                        </div>
                    </div>`;
                }).join('')}
            </div>

            <div id="kadro" class="tab-content">
                <div id="kadro-yukleniyor" style="text-align:center; padding:20px; color:#9ca3af;">
                    ⏳ Kadro Vikipedi'den canlı çekiliyor...
                </div>
            </div>
        `;

        document.getElementById('takimModal').style.display = "block";
        document.body.classList.add('modal-open');

        const kadroHtml = await vikipedidenKadroCek(t.ad);
        const kadroKonteynir = document.getElementById('kadro');
        if(kadroKonteynir) {
            kadroKonteynir.innerHTML = kadroHtml;
        }
    }

    function tabDegistir(evt, tabName) {
        const tabs = document.getElementsByClassName("tab-content");
        for (let t of tabs) t.classList.remove("active");
        const btns = document.getElementsByClassName("tab-btn");
        for (let b of btns) b.classList.remove("active");
        
        const targetTab = document.getElementById(tabName);
        if(targetTab) targetTab.classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function modalKapat() { 
        document.getElementById('takimModal').style.display = "none"; 
        document.body.classList.remove('modal-open');
    }

    window.onclick = (e) => { if(e.target.className == 'modal') modalKapat(); }
    window.onload = veriyiGetir;

    fetch('navbar.html')
        .then(response => {
            if(!response.ok) throw new Error("Navbar yüklenemedi");
            return response.text();
        })
        .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
        })
        .catch(err => console.warn(err.message));
