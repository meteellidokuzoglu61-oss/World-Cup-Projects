<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Kupası 2026 - Canlı Bilgi</title>
    
    <style>
        :root {
            --primary: #8A1538;
            --secondary: #bd9b60;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        body.modal-open { overflow: hidden; }

        header {
            text-align: center; padding: 50px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #004d98 100%);
            color: white; border-radius: 24px; margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .takim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .takim-karti { 
            background: white; border-radius: 18px; padding: 25px; text-align: center; 
            cursor: pointer; border: 1px solid #eee; transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .takim-karti:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); border-color: var(--secondary); }
        .bayrak { width: 90px; height: 60px; border-radius: 8px; object-fit: cover; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* MODAL TASARIMI */
        .modal {
            display: none; position: fixed; z-index: 9999; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            overflow-y: auto; padding: 20px 0;
        }

        .modal-content {
            background: white; margin: auto; width: 92%; max-width: 650px; 
            border-radius: 24px; overflow: hidden; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4); animation: modalGiris 0.4s ease;
        }

        @keyframes modalGiris { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .close-btn { 
            position: fixed; right: 25px; top: 20px; font-size: 45px; 
            color: white; cursor: pointer; z-index: 10001; transition: 0.2s;
        }
        .close-btn:hover { color: var(--secondary); }

        .modal-header { background: var(--primary); color: white; padding: 35px 20px; text-align: center; }
        
        .tab-menu { display: flex; background: #f8f9fa; border-bottom: 2px solid #eee; }
        .tab-btn { flex: 1; padding: 18px; border: none; cursor: pointer; font-weight: 700; color: #666; background: none; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 4px solid var(--primary); background: white; }
        
        .tab-content { display: none; padding: 25px; }
        .tab-content.active { display: block; }

        /* STADYUM KARTLARI */
        .stad-card { margin-bottom: 25px; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .stad-img { width: 100%; height: 280px; display: block; object-fit: cover; background-color: #f0f0f0; transition: 0.5s; }
        .stad-card:hover .stad-img { transform: scale(1.03); }
        .stad-info { padding: 18px; font-weight: 800; font-size: 1.1em; color: var(--primary); text-align: center; }

        .info-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; font-size: 1.05em; }
        .info-row strong { color: #555; }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="logo">
        <a href="index.html" style="text-decoration: none; color: inherit; font-weight: bold; font-size: 1.5em; padding: 10px; display: inline-block;">FIFA 2026</a>
    </div>

    <div class="container">
        <header>
            <h1>🏆 DÜNYA KUPASI 2026</h1>
            <p>Kuzey Amerika Yolculuğu Başlıyor</p>
        </header>
        <div id="federasyonlar-konteynir"></div>
    </div>

    <div id="takimModal" class="modal">
        <span class="close-btn" onclick="modalKapat()">&times;</span>
        <div class="modal-content">
            <div id="modal-icerik"></div>
        </div>
    </div>

<script>
   const stadyumGorselleri = {
        "MetLife": "https://w0.peakpx.com/wallpaper/161/435/HD-wallpaper-metlife-stadium-aerial-view-nfl-new-york-giants-stadium-new-york-jets-stadium-soccer-american-football-stadium-usa-new-jersey-american-stadiums.jpg",
        "SoFi": "https://st5.depositphotos.com/60241456/77824/i/450/depositphotos_778241476-stock-photo-inglewood-usa-november-2024-sofi.jpg",
        "AT&T": "https://t4.ftcdn.net/jpg/05/49/05/97/360_F_549059713_s0ntRZTHF1yB2vkJHYbzOKR8ZbsOLJNf.jpg",
        "Azteca": "https://media.istockphoto.com/id/1023819902/tr/foto%C4%9Fraf/mexico-citydeki-aztek-stadyumunun-havadan-g%C3%B6r%C3%BCn%C3%BCm%C3%BC.jpg?s=612x612&w=0&k=20&c=WIdzJOo5XZcf2FyzKUJT2VMGHW2QNly9qEsx8MrFFFQ=",
        "BC Place": "https://w0.peakpx.com/wallpaper/930/909/HD-wallpaper-bc-place-vancouver-whitecaps-fc-stadium-canadian-football-stadium-vancouver-british-columbia-canada-mls-stadiums-major-league-soccer.jpg",
        "Lumen": "https://static.clubs.nfl.com/image/private/t_new_photo_album/seahawks/rb5xedis3xxtppyxbsds.jpg",
        "Mercedes-Benz": "https://cdn.mos.cms.futurecdn.net/QT7b7RtMfc7doghPBpNutJ.jpg",
        "Hard Rock": "https://t3.ftcdn.net/jpg/03/05/52/14/360_F_305521418_yzUq5q5pXDsIl3C4TpzIuVzW9klVg4pV.jpg",
        "Arrowhead": "https://static.clubs.nfl.com/image/private/t_new_photo_album/chiefs/tr74gj3cjwaoe83qmy9k.jpg",
        "Levi's": "https://ww4.hdnux.com/photos/31/55/16/6738831/5/rawImage.jpg",
        "Lincoln": "https://wallpapercave.com/wp/wp11930816.jpg",
        "NRG Stadyumu": "https://media.istockphoto.com/id/2262548047/photo/aerial-view-of-nrg-stadium-and-downtown-houston-skyline-at-night.jpg?s=612x612&w=0&k=20&c=BZhqwyXYcFS2wVXqlCqJsVaAv_rempC0aLhLUO-XjcM=",
        "BMO": "https://w0.peakpx.com/wallpaper/105/530/HD-wallpaper-bmo-field-r-canadian-football-stadium-toronto-argonauts-stadium-aerial-view-canada-bmo-field-stadium-toronto.jpg",
        // Listende yeni eklenen veya resmi eksik olan diğer stadyumlar için de buraya varsayılan görseller ekledim:
        "BBVA": "https://w0.peakpx.com/wallpaper/837/626/HD-wallpaper-estadio-bbva-bancomer-the-steel-giant-guadalupe-nuevo-leon-mexico-cf-monterrey-stadium-mexican-football-stadiums-modern-sports-arenas-stadiums.jpg",
        "Akron": "https://w0.peakpx.com/wallpaper/154/234/HD-wallpaper-estadio-akron-zapopan-mexico-estadio-omnilife-estadio-chivas-club-deportivo-guadalajara-stadium-mexican-football-stadium.jpg",
        "Gillette Stadyumu": "https://images8.alphacoders.com/566/thumb-1920-566506.jpg"
    };

    const nisan2026Sira = { "ar": 2, "fr": 1, "es": 3, "gb-eng": 4, "br": 5, "pt": 6, "ma": 8, "tr": 22, "us": 14, "mx": 17, "ca": 28 };

    async function veriyiGetir() {
        try {
            const [tRes, dRes] = await Promise.all([fetch('takimlar.json'), fetch('data.json')]);
            const takimlar = await tRes.json();
            const detaylar = await dRes.json();
            const birlesmis = takimlar.map(t => ({ 
                ...t, 
                sira: nisan2026Sira[t.id] || t.sira, 
                ...(detaylar[t.id] || {}) 
            }));
            sayfayiOlustur(birlesmis);
        } catch (e) { console.error("Veri yükleme hatası:", e); }
    }

    function sayfayiOlustur(takimlar) {
        const konteynir = document.getElementById('federasyonlar-konteynir');
        const feds = [...new Set(takimlar.map(t => t.fed))];
        konteynir.innerHTML = "";
        feds.forEach(fed => {
            const section = document.createElement('div');
            section.innerHTML = `<h2 style="color:var(--primary); margin-top:40px; border-left:5px solid var(--secondary); padding-left:15px;">${fed}</h2><div class="takim-grid" id="grid-${fed.replace(/\s/g, '')}"></div>`;
            konteynir.appendChild(section);
            const grid = document.getElementById(`grid-${fed.replace(/\s/g, '')}`);
            takimlar.filter(t => t.fed === fed).forEach(t => {
                const kart = document.createElement('div');
                kart.className = 'takim-karti';
                kart.onclick = () => detayAc(t);
                kart.innerHTML = `<img src="https://flagcdn.com/w160/${t.id}.png" class="bayrak" alt="${t.ad}"><div><strong>${t.ad}</strong></div>`;
                grid.appendChild(kart);
            });
        });
    }

 async function vikipedidenKadroCek(takimAdi) {
        // Artık her ülkeyi ayrı aramıyoruz, direkt tüm kadroların olduğu ana turnuva sayfasını çekiyoruz
        const sayfaAdi = "2026_FIFA_Dünya_Kupası_kadroları";
        const url = `https://tr.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(sayfaAdi)}&prop=text&format=json&origin=*`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.error) return "<div style='padding:20px; text-align:center;'>Kadro sayfası Vikipedi'de bulunamadı.</div>";

            const htmlIcerik = data.parse.text["*"];
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlIcerik, 'text/html');

            // 1. Tıklanan ülkenin başlığını (h3 veya h4) bulmamız gerekiyor.
            // Vikipedi'de ülke başlıkları genellikle "Çek Cumhuriyeti [değiştir]" veya direkt "Türkiye" şeklinde h3/h4 içindedir.
            const basliklar = doc.querySelectorAll('h3, h4, .mw-heading3, .mw-heading4');
            let hedefBaslik = null;

            for (let baslik of basliklar) {
                const baslikText = baslik.textContent.trim().toLowerCase();
                const arananTakim = takimAdi.trim().toLowerCase();

                // Ülke ismi başlığın içinde geçiyor mu kontrol et (Örn: "çek cumhuriyeti" veya "abd")
                if (baslikText.includes(arananTakim) || arananTakim.includes(baslikText)) {
                    hedefBaslik = baslik;
                    break;
                }
            }

            if (!hedefBaslik) {
                return `<div style='padding:20px; text-align:center;'>${takimAdi} takımı için bu sayfada henüz bir kadro başlığı açılmamış.</div>`;
            }

            // 2. Başlığı bulduk! Şimdi bu başlıktan hemen sonra gelen ilk "wikitable" sınıfına sahip tabloyu (yani kadroyu) buluyoruz.
            let sonrakiEleman = hedefBaslik.nextElementSibling;
            let kadroTablosu = null;

            // Arada boşluk veya div'ler varsa tabloyu bulana kadar ileri git (maksimum 5 eleman zıpla)
            for (let i = 0; i < 5; i++) {
                if (!sonrakiEleman) break;
                
                if (sonrakiEleman.tagName === 'TABLE' && sonrakiEleman.classList.contains('wikitable')) {
                    kadroTablosu = sonrakiEleman;
                    break;
                }
                // Bazen tablo bir div'in içindedir
                const icindekiTablo = sonrakiEleman.querySelector('table.wikitable');
                if (icindekiTablo) {
                    kadroTablosu = icindekiTablo;
                    break;
                }
                sonrakiEleman = sonrakiEleman.nextElementSibling;
            }

            if (!kadroTablosu) {
                return `<div style='padding:20px; text-align:center;'>${takimAdi} başlığı bulundu fakat altındaki kadro tablosu okunamadı.</div>`;
            }

            // Temizlik: Vikipedi linklerini ve düzenle butonlarını kaldırıyoruz
            const temizTablo = kadroTablosu.cloneNode(true);
            temizTablo.querySelectorAll('.mw-editsection').forEach(el => el.remove());

            return `
    <div class="viki-kadro" style="overflow-x:auto; padding: 10px;">
        <style>
            .viki-kadro table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: white; }
            .viki-kadro th { background-color: var(--primary) !important; color: white !important; padding: 10px; text-align: left; }
            .viki-kadro td { padding: 8px; border-bottom: 1px solid #ddd; color: #333; }
            .viki-kadro tr:hover { background-color: #f5f5f5; }
            
            /* Genel link renkleri (Varsayılan mavi) */
            .viki-kadro a { color: #004d98; text-decoration: none; font-weight: 600; }
            
            /* BORDO HÜCRELERİN İÇİNDEKİ YAZILARI VE OYUNCU LİNKLERİNİ BEYAZ YAPAR */
            .viki-kadro td[style*="background"], 
            .viki-kadro td[style*="#8A1538"], 
            .viki-kadro td[style*="rgb(138"],
            .viki-kadro th[style*="background"],
            .viki-kadro th[style*="#8A1538"] { 
                color: #ffffff !important; 
            }
            
            .viki-kadro td[style*="background"] a, 
            .viki-kadro td[style*="#8A1538"] a, 
            .viki-kadro td[style*="rgb(138"] a,
            .viki-kadro th[style*="background"] a,
            .viki-kadro th[style*="#8A1538"] a { 
                color: #ffffff !important; 
                text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* Okunurluğu artırmak için hafif gölge */
            }
        </style>
        ${temizTablo.outerHTML}
    </div>`;

        } catch (error) {
            console.error("Ortak kadro sayfasından veri çekilirken hata oluştu:", error);
            return "<div style='padding:20px; text-align:center; color:red;'>Kadro yüklenirken bir hata oluştu.</div>";
        }
    }

    async function detayAc(t) {
        const icerik = document.getElementById('modal-icerik');
        const hasStad = t.stadyumlar && t.stadyumlar.length > 0;

        icerik.innerHTML = `
            <div class="modal-header">
                <img src="https://flagcdn.com/w160/${t.id}.png" width="100" style="border:4px solid white; border-radius:10px; margin-bottom:15px;" alt="Bayrak">
                <h2 style="margin:0; letter-spacing:1px;">${t.ad.toUpperCase()}</h2>
            </div>
            <div class="tab-menu">
                <button class="tab-btn active" onclick="tabDegistir(event, 'genel')">KÜNYE</button>
                ${hasStad ? `<button class="tab-btn" onclick="tabDegistir(event, 'stadlar')">STADYUMLAR</button>` : ''}
                <button class="tab-btn" onclick="tabDegistir(event, 'kadro')">KADRO</button>
            </div>
            
            <div id="genel" class="tab-content active">
                <div class="info-row"><strong>Teknik Direktör</strong><span>${t["Teknik Direktör"] || 'Belli Değil'}</span></div>
                <div class="info-row"><strong>FIFA Dünya Sırası</strong> <span>#${t.sira || '-'}</span></div>
                <div class="info-row"><strong>Takım Lakabı</strong> <span>${t.lakap || 'Yok'}</span></div>
            </div>
            
           <div id="stadlar" class="tab-content">
    ${(t.stadyumlar || []).map(s => {
        if (!s.ad) return ''; 
        
        const gelenStadAdi = s.ad.toLocaleLowerCase('tr-TR');
        const stadKey = Object.keys(stadyumGorselleri).find(k => {
            return gelenStadAdi.includes(k.toLocaleLowerCase('tr-TR'));
        }) || "";
        
        const imgUrl = stadyumGorselleri[stadKey] || "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80";
        
        // Doğru ve temiz Google Maps Arama URL'i
        const haritaLinki = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.ad + ' ' + (s.sehir || ''))}`;
        
        return `
        <div class="stad-card" style="position: relative;">
            <img src="${imgUrl}" class="stad-img" alt="${s.ad}">
            <div class="stad-info">
                ${s.ad} <br> 
                <small style="color:#666; font-weight:normal; display:block; margin-bottom:8px;">${s.sehir || ''}</small>
                
                <a href="${haritaLinki}" target="_blank" style="display: inline-block; padding: 6px 14px; background-color: #24a0ed; color: white !important; text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 8px; margin-top: 5px; transition: 0.2s;">
                    📍 Haritada Göster
                </a>
            </div>
        </div>`;
    }).join('')}
</div>

            <div id="kadro" class="tab-content">
                <div id="kadro-yukleniyor" style="text-align:center; padding:20px; color:#666;">
                    ⏳ Kadro Vikipedi'den canlı çekiliyor...
                </div>
            </div>
        `;

        document.getElementById('takimModal').style.display = "block";
        document.body.classList.add('modal-open');

        const kadroHtml = await vikipedidenKadroCek(t.ad);
        const kadroKonteynir = document.getElementById('kadro');
        if(kadroKonteynir) {
            kadroKonteynir.innerHTML = kadroHtml;
        }
    }

    function tabDegistir(evt, tabName) {
        const tabs = document.getElementsByClassName("tab-content");
        for (let t of tabs) t.classList.remove("active");
        const btns = document.getElementsByClassName("tab-btn");
        for (let b of btns) b.classList.remove("active");
        
        const targetTab = document.getElementById(tabName);
        if(targetTab) targetTab.classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    function modalKapat() { 
        document.getElementById('takimModal').style.display = "none"; 
        document.body.classList.remove('modal-open');
    }

    window.onclick = (e) => { if(e.target.className == 'modal') modalKapat(); }
    window.onload = veriyiGetir;

    fetch('navbar.html')
        .then(response => {
            if(!response.ok) throw new Error("Navbar yüklenemedi");
            return response.text();
        })
        .then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
        })
        .catch(err => console.warn(err.message));
</script>
</body>
</html>
