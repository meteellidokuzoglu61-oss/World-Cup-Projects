<!DOCTYPE html>

        .mac-olaylari {

<body>

<div class="container">
    <header>
        <h1>FIFA World Cup 2026</h1>
        <div class="subtitle">Amerika • Kanada • Meksika | Resmi Maç Merkezi</div>
    </header>

    <div class="navigation-bar">
        <div class="filter-group">
            <label style="font-weight: 800;">GRUP FİLTRESİ:</label>
            <select id="grupSecici" onchange="ekraniGuncelle()">
                <option value="Tümü">Tüm Grupları Göster</option>
                <option value="A Grubu">A Grubu</option>
                <option value="B Grubu">B Grubu</option>
                <option value="C Grubu">C Grubu</option>
                <option value="D Grubu">D Grubu</option>
                <option value="E Grubu">E Grubu</option>
                <option value="F Grubu">F Grubu</option>
                <option value="G Grubu">G Grubu</option>
                <option value="H Grubu">H Grubu</option>
                <option value="I Grubu">I Grubu</option>
                <option value="J Grubu">J Grubu</option>
                <option value="K Grubu">K Grubu</option>
                <option value="L Grubu">L Grubu</option>
            </select>
        </div>
        <button class="btn-all" onclick="fiksturuYukle()">Tazele / Tüm Maçlar</button>
    </div>

    <div id="puan-durumu-bolumu">
        <h2 id="grupBaslik" style="text-align: center; color: var(--primary-color); margin-bottom: 30px;">Grup Puan Durumu</h2>
        <div id="puan-tablosu-alani"></div>
    </div>

    <div id="fikstur-listesi" class="fikstur-grid"></div>
</div>

<div id="macModal" class="modal" style="display:none;">
    <div class="modal-icerik">
        <span class="kapat-btn" onclick="modalKapat()">&times;</span>
        <div id="modal-govde"></div>
    </div>
</div>

<script>
if (typeof supabase === 'undefined') {
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    document.head.appendChild(script);
}

const SUPABASE_URL = "https://yvajaofucbgqxugfynx.supabase.co";
const SUPABASE_ANON_KEY = "BURAYA_PANELDEN_ALDIĞIN_ANON_KEYI_YAPIŞTIR";

let supabaseClient;
function initSupabase() {
    if (typeof supabase !== 'undefined' && !supabaseClient) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
}

const teamData = {
    "Kanada": { rank: 30, form: "G-B-M-G-B" },
    "Bosna-Hersek": { rank: 65, form: "M-M-B-G-M" },
    "Türkiye": { rank: 40, form: "G-B-G-M-G" },
    "ABD": { rank: 20, form: "G-G-B-G-M" },
    "Meksika": { rank: 15, form: "G-G-B-M-G" },
    "Güney Afrika": { rank: 55, form: "M-B-M-G-M" }
};

function calculateScore(rank, form) {
    let formScore = 0;
    form.split("-").forEach(r => {
        if (r === "G") formScore += 3;
        if (r === "B") formScore += 1;
    });
    let rankScore = 100 - rank;
    return rankScore * 0.6 + formScore * 0.4;
}

function calculateProbabilities(a, b) {
    let total = a + b;
    let winA = (a / total) * 0.7;
    let winB = (b / total) * 0.7;
    let draw = 1 - (winA + winB);
    return {
        A: (winA * 100).toFixed(1),
        B: (winB * 100).toFixed(1),
        draw: (draw * 100).toFixed(1)
    };
}

function safeText(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function modalKapat() {
    document.getElementById('macModal').style.display = "none";
}

async function fiksturuYukle() {
    initSupabase();
    const container = document.getElementById('fikstur-listesi');
    const grupSecici = document.getElementById('grupSecici');
    
    grupSecici.value = "Tümü";
    container.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'>Veriler yükleniyor...</div>";
    
    try {
        const response = await fetch('fikstur.json');
        if (!response.ok) throw new Error("Dosya bulunamadı");
        const veriler = await response.json();
        kartlariEkranaBas(veriler);
        document.getElementById('puan-durumu-bolumu').style.display = "none";
    } catch (err) {
        container.innerHTML = `<div style='grid-column: 1/-1; color:red; text-align:center;'>Hata: ${err.message}</div>`;
    }
}

async function ekraniGuncelle() {
    const grupSecici = document.getElementById('grupSecici');
    const puanPaneli = document.getElementById('puan-durumu-bolumu');
    let secilenDeger = grupSecici.value;
    const isGrupAsamasi = secilenDeger.includes("Grubu") && secilenDeger !== "Tümü";

    if (isGrupAsamasi) {
        puanPaneli.style.display = "block";
        const baslik = document.getElementById('grupBaslik');
        if(baslik) baslik.innerText = `${secilenDeger} Puan Durumu`;
    } else {
        puanPaneli.style.display = "none";
    }

    try {
        const res = await fetch('fikstur.json');
        const tumu = await res.json();
        const filtreli = (secilenDeger === "Tümü" || secilenDeger === "") 
            ? tumu 
            : tumu.filter(m => m.grup === secilenDeger);
        
        kartlariEkranaBas(filtreli);

        if (isGrupAsamasi) {
            puanDurumuHesapla(secilenDeger, tumu);
        }
    } catch(e) {
        console.error("Filtreleme hatası:", e);
    }
}

function kartlariEkranaBas(maclar) {
    const container = document.getElementById('fikstur-listesi');
    container.innerHTML = "";
    
    if (maclar.length === 0) {
        container.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'>Bu aşamada henüz maç bulunmuyor.</div>";
        return;
    }

    maclar.forEach(mac => {
        const isTurkiye = (mac.ev === "Türkiye" || mac.dep === "Türkiye");
        const skorStr = (mac.skorEv !== undefined && mac.skorEv !== null) ? `${mac.skorEv} - ${mac.skorDep}` : "VS";
        
        container.innerHTML += `
            <div class="mac-karti ${isTurkiye ? 'turkiye-vurgu' : ''}" onclick="detayGoster('${mac.ev}', '${mac.dep}')">
                <div class="grup-etiket">
                    <span>🏆 ${mac.grup}</span>
                    <span>📅 ${mac.tarih}</span>
                </div>
                <div class="takimlar-konteynir">
                    <div class="takim-kutusu">
                        <img src="https://flagcdn.com/w160/${mac.kodEv}.png" class="bayrak-ana" alt="${mac.ev}">
                        <span class="takim-adi">${mac.ev}</span>
                    </div>
                    <div class="skor-merkez">${skorStr}</div>
                    <div class="takim-kutusu">
                        <img src="https://flagcdn.com/w160/${mac.kodDep}.png" class="bayrak-ana" alt="${mac.dep}">
                        <span class="takim-adi">${mac.dep}</span>
                    </div>
                </div>
                <div class="mac-detay-footer">
                    <div class="saat-row">
                        <div class="saat-item"><span class="label-saat">TSİ</span><span class="val-saat">${mac.tsi}</span></div>
                        <div class="saat-item"><span class="label-saat">YEREL</span><span class="val-saat" style="color:#0984e3">${mac.yerel}</span></div>
                    </div>
                    <div class="stat-text">📍 ${mac.stat}</div>
                </div>
            </div>`;
    });
}

function puanDurumuHesapla(grup, tumMaclar) {
    const tabloAlani = document.getElementById('puan-tablosu-alani');
    let tablo = {};
    const grupMaclari = tumMaclar.filter(m => m.grup === grup);

    grupMaclari.forEach(m => {
        [m.ev, m.dep].forEach(t => {
            if (!tablo[t]) tablo[t] = { O:0, G:0, B:0, M:0, AG:0, YG:0, P:0, kod: (t === m.ev ? m.kodEv : m.kodDep) };
        });

        if (m.skorEv !== undefined && m.skorEv !== null) {
            const sE = parseInt(m.skorEv); const sD = parseInt(m.skorDep);
            tablo[m.ev].O++; tablo[m.dep].O++;
            tablo[m.ev].AG += sE; tablo[m.ev].YG += sD;
            tablo[m.dep].AG += sD; tablo[m.dep].YG += sE;
            if (sE > sD) { tablo[m.ev].G++; tablo[m.ev].P += 3; tablo[m.dep].M++; }
            else if (sD > sE) { tablo[m.dep].G++; tablo[m.dep].P += 3; tablo[m.ev].M++; }
            else { tablo[m.ev].B++; tablo[m.ev].P += 1; tablo[m.dep].B++; tablo[m.dep].P += 1; }
        }
    });

    const sirali = Object.keys(tablo).sort((a, b) => (tablo[b].P - tablo[a].P) || ((tablo[b].AG - tablo[b].YG) - (tablo[a].AG - tablo[a].YG)));

    let html = `<table class="puan-tablosu"><thead><tr><th>Sıra</th><th style="text-align:left">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>Puan</th></tr></thead><tbody>`;
    sirali.forEach((tAd, index) => {
        const v = tablo[tAd]; const av = v.AG - v.YG;
        html += `<tr><td><span class="sira-no">${index+1}</span></td><td class="takim-hucre"><img src="https://flagcdn.com/w40/${v.kod}.png" class="puan-bayrak">${tAd}</td><td>${v.O}</td><td>${v.G}</td><td>${v.B}</td><td>${v.M}</td><td style="color:${av>=0?'green':'red'}">${av>0?'+'+av:av}</td><td style="font-weight:900; color:#800020">${v.P}</td></tr>`;
    });
    tabloAlani.innerHTML = html + "</tbody></table>";
}

// --- MODAL DETAY GÖSTERİMİ ---
async function detayGoster(ev, dep) {
    initSupabase();
    const modal = document.getElementById('macModal');
    const govde = document.getElementById('modal-govde');
    const macId = `${ev}-${dep}`.replace(/\s+/g, '-');
    
    modal.style.display = "flex";
    govde.innerHTML = "<div style='text-align:center; padding: 20px;'>Veriler yükleniyor...</div>";

    try {
        const response = await fetch('istatistik.json');
        const istatistikler = await response.json();
        
        const evD = istatistikler[ev] || { sira: "??", form: "N/A" };
        const depD = istatistikler[dep] || { sira: "??", form: "N/A" };
        const macMaciData = istatistikler[macId];

        let modalHtml = `
            <div style="text-align:center; border-bottom: 2px solid #f1f2f6; padding-bottom: 20px; margin-bottom: 20px;">
                <h2 style="color:var(--primary-color); font-size: 1.8em; margin:0;">${ev} <span style="color:#ccc; font-weight:300;">v</span> ${dep}</h2>
            </div>
            
            <table class="istatistik-tablo" style="width:100%; margin-bottom:20px; font-size:13px; color:#5f6368;">
                <tr style="font-weight:800; color:var(--primary-color); font-size:14px;"><td>${ev}</td><td style="color:#b2bec3">KATEGORİ</td><td>${dep}</td></tr>
                <tr><td>#${evD.sira}</td><td>FIFA SIRALAMASI</td><td>#${depD.sira}</td></tr>
                <tr><td style="color:var(--success-green); font-weight:bold;">${evD.form}</td><td>FORM DURUMU</td><td style="color:var(--success-green); font-weight:bold;">${depD.form}</td></tr>
            </table>
        `;

        if (macMaciData) {
            // --- GOL VE KART OLAYLARI (MAÇ ÖZETİ) ---
            let olaylarHtml = `<div class="mac-olaylari">`;
            
            if (macMaciData.goller && macMaciData.goller.length > 0) {
                macMaciData.goller.forEach(g => {
                    olaylarHtml += `
                        <div class="olay-satir">
                            <div class="olay-sol">${g.takim === 'ev' ? g.oyuncu + ' ⚽' : ''}</div>
                            <div class="olay-orta">${g.dakika}'</div>
                            <div class="olay-sag">${g.takim === 'dep' ? '⚽ ' + g.oyuncu : ''}</div>
                        </div>`;
                });
            }
            if (macMaciData.sariKartlar && macMaciData.sariKartlar.length > 0) {
                macMaciData.sariKartlar.forEach(k => {
                    olaylarHtml += `
                        <div class="olay-satir">
                            <div class="olay-sol">${k.takim === 'ev' ? k.oyuncu + ' 🟨' : ''}</div>
                            <div class="olay-orta">${k.dakika}'</div>
                            <div class="olay-sag">${k.takim === 'dep' ? '🟨 ' + k.oyuncu : ''}</div>
                        </div>`;
                });
            }
            if (macMaciData.kirmiziKartlar && macMaciData.kirmiziKartlar.length > 0) {
                macMaciData.kirmiziKartlar.forEach(k => {
                    olaylarHtml += `
                        <div class="olay-satir">
                            <div class="olay-sol">${k.takim === 'ev' ? k.oyuncu + ' 🟥' : ''}</div>
                            <div class="olay-orta">${k.dakika}'</div>
                            <div class="olay-sag">${k.takim === 'dep' ? '🟥 ' + k.oyuncu : ''}</div>
                        </div>`;
                });
            }
            olaylarHtml += `</div>`;
            modalHtml += olaylarHtml;

            // --- GOOGLE FORMATINDA GERÇEK İSTATİSTİKLER ---
            const createStatRow = (title, evVal, depVal, isPercent = false) => {
                const eNum = parseFloat(evVal);
                const dNum = parseFloat(depVal);
                const total = eNum + dNum;
                const ePct = total > 0 ? (eNum / total) * 100 : 50;
                const dPct = total > 0 ? (dNum / total) * 100 : 50;

                const evBadgeClass = eNum > dNum ? 'google-badge win' : 'google-badge neutral';
                const depBadgeClass = dNum > eNum ? 'google-badge win' : 'google-badge neutral';
                
                const evDisplay = isPercent ? `%${evVal}` : evVal;
                const depDisplay = isPercent ? `%${depVal}` : depVal;

                return `
                    <div class="google-stat-row">
                        <div class="google-stat-labels">
                            <span class="${evBadgeClass}">${evDisplay}</span>
                            <span class="google-stat-title">${title}</span>
                            <span class="${depBadgeClass}">${depDisplay}</span>
                        </div>
                        <div class="google-stat-bar-bg">
                            <div class="google-stat-bar-left" style="width: ${isPercent ? evVal : ePct}%;"></div>
                            <div class="google-stat-bar-right" style="width: ${isPercent ? depVal : dPct}%;"></div>
                        </div>
                    </div>
                `;
            };

            modalHtml += `
                <div class="google-stat-container">
                    <h3 style="text-align:center; font-size:15px; color:#202124; margin-bottom:20px; border-bottom:1px solid #f1f3f4; padding-bottom:10px;">TAKIM İSTATİSTİKLERİ</h3>
                    ${createStatRow("Toplam şut", macMaciData.evSut || 0, macMaciData.depSut || 0)}
                    ${createStatRow("İsabetli şut sayısı", macMaciData.evIsabet || 0, macMaciData.depIsabet || 0)}
                    ${createStatRow("Topla Oynama", macMaciData.evTop || 50, macMaciData.depTop || 50, true)}
                    ${createStatRow("Pas", macMaciData.evPas || 0, macMaciData.depPas || 0)}
                    ${createStatRow("Pas isabeti", macMaciData.evPasIsabet || 0, macMaciData.depPasIsabet || 0, true)}
                    ${createStatRow("Faul", macMaciData.evFaul || 0, macMaciData.depFaul || 0)}
                    ${createStatRow("Sarı kart", macMaciData.evSari || 0, macMaciData.depSari || 0)}
                    ${createStatRow("Kırmızı kart", macMaciData.evKirmizi || 0, macMaciData.depKirmizi || 0)}
                    ${createStatRow("Ofsayt", macMaciData.evOfsayt || 0, macMaciData.depOfsayt || 0)}
                    ${createStatRow("Korner", macMaciData.evKorner || 0, macMaciData.depKorner || 0)}
                </div>
            `;

            // --- İLK 11 VE YEDEK KADROLARININ BASILMASI ---
            modalHtml += `
                <div class="kadro-bolumu">
                    <div class="kadro-baslik">📋 KADROLAR</div>
                    <div class="kadro-grid">
                        <div class="kadro-liste">
                            <div class="kadro-alt-baslik">${ev} İlk 11</div>
                            <div id="evKadro11"></div>
                            <div class="kadro-alt-baslik" style="margin-top:15px;">Yedekler</div>
                            <div id="evYedekler"></div>
                        </div>
                        <div class="kadro-liste">
                            <div class="kadro-alt-baslik">${dep} İlk 11</div>
                            <div id="depKadro11"></div>
                            <div class="kadro-alt-baslik" style="margin-top:15px;">Yedekler</div>
                            <div id="depYedekler"></div>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // --- MAÇ OYNANMADIYSA: AI TAHMİNLERİ ---
            let teamA = teamData[ev] || { rank: 50, form: "B-B-B-B-B" };
            let teamB = teamData[dep] || { rank: 50, form: "B-B-B-B-B" };
            let scoreA = calculateScore(teamA.rank, teamA.form);
            let scoreB = calculateScore(teamB.rank, teamB.form);
            let probs = calculateProbabilities(scoreA, scoreB);

            modalHtml += `
                <div style="margin-top:20px; padding:20px; background:#f8f9fa; border-radius:15px;">
                    <h3 style="text-align:center; margin-top:0;">🔮 Maç Olasılıkları (AI Tahmini)</h3>
                    <p>${ev}: %${probs.A}</p><div style="background:#eee; height:8px; border-radius:5px;"><div style="width:${probs.A}%; background:green; height:100%; border-radius:5px;"></div></div>
                    <p>Beraberlik: %${probs.draw}</p><div style="background:#eee; height:8px; border-radius:5px;"><div style="width:${probs.draw}%; background:orange; height:100%; border-radius:5px;"></div></div>
                    <p>${dep}: %${probs.B}</p><div style="background:#eee; height:8px; border-radius:5px;"><div style="width:${probs.B}%; background:red; height:100%; border-radius:5px;"></div></div>
                </div>
            `;
        }

        // Yorum Kısmı Entegrasyonu
        modalHtml += `
            <div class="yorum-section">
                <h3>💬 Taraftar Yorumları</h3>
                <div id="yorumlar-listesi">Yükleniyor...</div>
                <div class="yorum-input-box">
                    <input type="text" id="yorumInput" maxlength="200" placeholder="Yorumun...">
                    <button id="submitBtn" class="btn-gonder" onclick="yorumGonder('${macId}')">GÖNDER</button>
                </div>
            </div>
        `;
        
        govde.innerHTML = modalHtml;

        // Kadro verilerini asenkron olarak yerleştirme mantığı
        if (macMaciData) {
            const basKadro = (elementId, liste) => {
                const el = document.getElementById(elementId);
                if (el && liste && liste.length > 0) {
                    el.innerHTML = liste.map(p => `
                        <div class="oyuncu-satir">
                            <span><span class="oyuncu-no">${p.no}</span>${p.ad}</span>
                            <span style="color:#70757a; font-size:11px;">${p.pos}</span>
                        </div>`).join('');
                } else if(el) {
                    el.innerHTML = "<p style='color:#aaa; font-size:12px;'>Açıklanmadı</p>";
                }
            };
            basKadro("evKadro11", macMaciData.ev11);
            basKadro("evYedekler", macMaciData.evYedek);
            basKadro("depKadro11", macMaciData.dep11);
            basKadro("depYedekler", macMaciData.depYedek);
        }

        yorumlarıCek(macId);
    } catch (err) { 
        console.error(err);
        govde.innerHTML = "<div style='text-align:center; padding:20px; color:red;'>İstatistik verileri yüklenemedi.</div>"; 
    }
}

async function yorumlarıCek(macId) {
    const liste = document.getElementById('yorumlar-listesi');
    if (!supabaseClient) return;

    try {
        const { data: yorumlar, error } = await supabaseClient
            .from('yorumlar')
            .select('*')
            .eq('mac_id', macId)
            .order('created_at', { ascending: false });

        if (error) throw error;

        if(!yorumlar || yorumlar.length === 0) { 
            liste.innerHTML = "<p style='color:#aaa; font-size:13px;'>İlk yorumu sen yap!</p>"; 
            return; 
        }
        
        liste.innerHTML = yorumlar.map(y => {
            const kAdi = y.kullanici_adi ? y.kullanici_adi : "Anonim";
            return `<div class="yorum-kart"><strong>@${safeText(kAdi)}</strong>: ${safeText(y.yorum_metni)}</div>`;
        }).join('');

    } catch (e) { 
        console.error("Yorum çekme hatası:", e);
        liste.innerHTML = "<p>Yorumlar şu an yüklenemiyor.</p>"; 
    }
}

async function yorumGonder(macId) {
    const input = document.getElementById('yorumInput');
    const btn = document.getElementById('submitBtn');
    const metin = input.value.trim();
    
    if(!metin || !supabaseClient) return;
    btn.disabled = true;

    try {
        const { error } = await supabaseClient
            .from('yorumlar')
            .insert([
                { mac_id: macId, kullanici_adi: "Taraftar", yorum_metni: metin }
            ]);

        if(error) throw error;
        input.value = "";
        yorumlarıCek(macId);
    } catch(e) {
        alert("Yorum gönderilemedi.");
    } finally {
        btn.disabled = false;
    }
}

window.onload = () => {
    fiksturuYukle();
};
