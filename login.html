<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 | Giriş Paneli</title>
    
    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    
    <style>
        :root { --primary: #8A1538; --dark: #1a1a1a; --white: #ffffff; }
        body { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2000') center/cover no-repeat fixed;
            font-family: 'Segoe UI', sans-serif; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
        }
        .container { background: var(--white); width: 100%; max-width: 400px; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 30px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { color: var(--primary); margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; transition: 0.3s; }
        .verification-box { display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="auth-tabs">
        <div class="tab active" onclick="switchTab('login')">Giriş Yap</div>
        <div class="tab" onclick="switchTab('register')">Kayıt Ol</div>
    </div>

    <div id="login-form" class="form-section active">
        <h2>Hoş Geldiniz</h2>
        <input type="text" id="l-username" placeholder="Kullanıcı Adı">
        <input type="password" id="l-password" placeholder="Şifre">
        <button class="btn" onclick="handleAuth('login')">GİRİŞ YAP</button>
    </div>

    <div id="register-form" class="form-section">
        <h2>Hesap Oluştur</h2>
        <div id="register-inputs">
            <input type="text" id="r-username" placeholder="Kullanıcı Adı">
            <input type="password" id="r-password" placeholder="Şifre (En az 6 karakter, harf ve rakam)">
            <button class="btn" onclick="handleAuth('register')">KAYIT OL</button>
        </div>
    </div>
</div>

<script>
    let baseUrl = 'http://localhost:3000/api/'; 
    if (window.location.hostname !== 'localhost') {
        baseUrl = 'https://world-cup-projects.onrender.com/api/'; 
    }

    function switchTab(target) {
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(target + '-form').classList.add('active');
        const index = target === 'login' ? 0 : 1;
        document.querySelectorAll('.tab')[index].classList.add('active');
    }

    async function handleAuth(type) {
        const usernameField = type === 'login' ? 'l-username' : 'r-username';
        const passwordField = type === 'login' ? 'l-password' : 'r-password';
        
        const username = document.getElementById(usernameField).value.trim();
        const password = document.getElementById(passwordField).value;

        if (!username || !password) {
            alert("Lütfen tüm alanları doldurun.");
            return;
        }

        const payload = { username, password };
        let url = baseUrl + type;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (response.ok && data.success) {
                if(type === 'login') {
                    localStorage.setItem('fifa_auth', 'basarili');
                    localStorage.setItem('fifa_user', data.yonetici);
                    window.location.replace('index.html');
                } else {
                    alert('Kayıt başarıyla oluşturuldu! Şimdi giriş yapabilirsiniz.');
                    switchTab('login');
                }
            } else {
                alert(data.message || "Bir hata oluştu.");
            }
        } catch (err) {
            console.error(err);
            alert('Sunucu bağlantı hatası!');
        }
    }
</script>
</body>
</html>
