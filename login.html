<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA 2026 | Giriş Paneli</title>
    <style>
        :root { --primary: #8A1538; --dark: #1a1a1a; --white: #ffffff; }
        body { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2000') center/cover no-repeat fixed;
            font-family: 'Segoe UI', sans-serif; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
        }
        .container { background: var(--white); width: 100%; max-width: 400px; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 30px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { color: var(--primary); margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; transition: 0.3s; }
        .verification-box { display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="auth-tabs">
        <div class="tab active" onclick="switchTab('login')">Giriş Yap</div>
        <div class="tab" onclick="switchTab('register')">Kayıt Ol</div>
    </div>

    <div id="login-form" class="form-section active">
        <h2>Hoş Geldiniz</h2>
        <input type="email" id="l-email" placeholder="E-posta">
        <input type="password" id="l-password" placeholder="Şifre">
        <button class="btn" onclick="handleAuth('login')">GİRİŞ YAP</button>
    </div>

    <div id="register-form" class="form-section">
        <h2>Hesap Oluştur</h2>
        <div id="register-inputs">
            <input type="text" id="r-username" placeholder="Kullanıcı Adı">
            <input type="email" id="r-email" placeholder="E-posta">
            <input type="password" id="r-password" placeholder="Şifre (En az 6 karakter, harf ve rakam)">
            <button class="btn" onclick="handleAuth('register')">KOD GÖNDER & KAYIT OL</button>
        </div>

        <div id="verification-section" class="verification-box">
            <p style="font-size: 0.9rem; color: #555; margin-top: 0; text-align: center;">E-posta adresinize bir doğrulama kodu gönderildi.</p>
            <input type="text" id="v-code" placeholder="6 Haneli Onay Kodu" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 1.2rem;">
            <button class="btn" onclick="verifyCode()">KODU ONAYLA</button>
        </div>
    </div>
</div>

<script>
    let registeredEmail = ""; // Onaylama işlemi için e-postayı hafızada tutuyoruz

    // Canlı veya yerel API URL ayarı
    let baseUrl = 'http://localhost:3000/api/'; 
    if (window.location.hostname !== 'localhost') {
        baseUrl = 'https://backend-linkiniz.com/api/'; // <-- Kendi canlı API adresinizi buraya yazın
    }

    function switchTab(target) {
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(target + '-form').classList.add('active');
        if(target !== 'forgot') {
            const index = target === 'login' ? 0 : 1;
            document.querySelectorAll('.tab')[index].classList.add('active');
        }
    }

    async function handleAuth(type) {
        const emailField = type === 'login' ? 'l-email' : 'r-email';
        const passwordField = type === 'login' ? 'l-password' : 'r-password';
        
        const email = document.getElementById(emailField).value.trim();
        const password = document.getElementById(passwordField).value;

        if (!email || !password) {
            alert("Lütfen tüm alanları doldurun.");
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Lütfen geçerli bir e-posta adresi girin.");
            return;
        }

        if (type === 'register') {
            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;
            if (!passwordRegex.test(password)) {
                alert("Şifre en az 6 karakter uzunluğunda olmalı, en az bir harf ve bir rakam içermelidir.");
                return;
            }
        }

        let payload = { email, password };
        if (type === 'register') {
            payload.username = document.getElementById('r-username').value.trim();
            if (!payload.username) {
                alert("Lütfen bir kullanıcı adı belirleyin.");
                return;
            }
            registeredEmail = email; // E-postayı doğrulama için kaydet
        }

        let url = baseUrl + type;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (response.ok && data.success) {
                if(type === 'login') {
                    localStorage.setItem('fifa_auth', 'basarili');
                    localStorage.setItem('fifa_user_data', JSON.stringify(data.user));
                    window.location.replace('index.html');
                } else {
                    // Kayıt isteği başarılıysa kod giriş alanını göster, eski girdileri gizle
                    document.getElementById('register-inputs').style.display = 'none';
                    document.getElementById('auth-tabs').style.pointerEvents = 'none'; // Sekme geçişini kilitle
                    document.getElementById('verification-section').style.display = 'block';
                    alert('Doğrulama kodu e-postanıza gönderildi. Lütfen kontrol edin.');
                }
            } else {
                alert(data.message || "Bir hata oluştu.");
            }
        } catch (err) {
            console.error(err);
            alert('Sunucu bağlantı hatası!');
        }
    }

    // Kod Doğrulama Fonksiyonu
    async function verifyCode() {
        const code = document.getElementById('v-code').value.trim();
        if(code.length !== 6) {
            alert("Lütfen 6 haneli kodu eksiksiz girin.");
            return;
        }

        try {
            const response = await fetch(baseUrl + 'verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: registeredEmail, otp: code })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                alert('Hesabınız başarıyla doğrulandı! Şimdi giriş yapabilirsiniz.');
                // Formu sıfırla ve giriş sekmesine at
                document.getElementById('register-inputs').style.display = 'block';
                document.getElementById('verification-section').style.display = 'none';
                document.getElementById('auth-tabs').style.pointerEvents = 'auto';
                switchTab('login');
            } else {
                alert(data.message || "Hatalı veya süresi dolmuş kod.");
            }
        } catch (err) {
            alert("Doğrulama sırasında sunucu hatası oluştu.");
        }
    }
</script>
</body>
</html>
