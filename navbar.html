    <nav class="fifa-navbar">
        <div class="fifa-logo">
            <a href="index.html">
                <span class="trophy-icon">🏆</span> FIFA <span>2026</span>
            </a>
        </div>

        <ul class="fifa-nav-links" id="fifa-nav-menu">
            <li><a href="index.html" data-page="index.html">Ana Sayfa</a></li>
            <li><a href="fikstur.html" data-page="fikstur.html">Fikstür</a></li>
            <li><a href="takimlar.html" data-page="takimlar.html">Takımlar</a></li>

            <li><a href="profil.html" data-page="profil.html" class="nav-profile-link">👤 <span id="nav-user-display">Profilim</span></a></li>
            <li><a href="javascript:void(0)" onclick="fifaCikisYap()" class="nav-logout-btn">Çıkış</a></li>
        </ul>
    </nav>
</header>

<style>
:root {
    --fifa-primary: #8A1538;
    --fifa-gold: #bd9b60;
    --fifa-dark: #0f141e;
    --fifa-white: #ffffff;
    --nav-height: 72px;
}

#fifa-main-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    z-index: 9999;
}

.fifa-navbar {
    height: 100%;
    background: rgba(138, 21, 56, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(189, 155, 96, 0.3);
}

.fifa-logo a {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--fifa-white);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
}

.fifa-logo a span {
    color: var(--fifa-gold);
}

.fifa-logo .trophy-icon {
    font-size: 1.3rem;
}

.fifa-nav-links {
    display: flex;
    list-style: none;
    gap: 8px;
    align-items: center;
    margin: 0;
    padding: 0;
}

.fifa-nav-links li a {
    text-decoration: none;
    color: rgba(255, 255, 255, 0.9);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    transition: all 0.25s ease;
    white-space: nowrap;
    display: inline-block;
}

.fifa-nav-links li a:hover {
    color: var(--fifa-white);
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-1px);
}

.fifa-nav-links li a.active {
    background: rgba(189, 155, 96, 0.25);
    color: #ffd700 !important;
    border: 1px solid rgba(189, 155, 96, 0.4);
}

.fifa-nav-links .nav-profile-link {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.fifa-nav-links .nav-logout-btn {
    background: #e11d48;
    color: white !important;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-left: 6px;
}

.fifa-nav-links .nav-logout-btn:hover {
    background: #be123c;
}

/* Mobil ve Tablet Uyumluluğu */
@media (max-width: 960px) {
    .fifa-navbar {
        flex-direction: column;
        height: auto;
        padding: 10px 15px;
        gap: 8px;
    }

    #fifa-main-header {
        height: auto;
    }

    .fifa-nav-links {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        justify-content: flex-start;
        gap: 6px;
    }

    .fifa-nav-links::-webkit-scrollbar {
        height: 3px;
    }
    .fifa-nav-links::-webkit-scrollbar-thumb {
        background: var(--fifa-gold);
        border-radius: 3px;
    }

    .fifa-nav-links li a {
        font-size: 0.82rem;
        padding: 6px 10px;
    }
}
</style>

<script>
(function() {
    // Aktif sayfayı işaretle
    const currentPath = window.location.pathname.split('/').pop() || 'index.html';
    const links = document.querySelectorAll('.fifa-nav-links a[data-page]');
    links.forEach(l => {
        if (l.getAttribute('data-page') === currentPath) {
            l.classList.add('active');
        }
    });

    // Kullanıcı adını navbarda göster
    const userDataStr = localStorage.getItem('fifa_user_data');
    const authStatus = localStorage.getItem('fifa_auth');
    const displayEl = document.getElementById('nav-user-display');
    
    if (displayEl) {
        if (authStatus === 'misafir') {
            displayEl.innerText = "Misafir";
        } else if (userDataStr) {
            try {
                const u = JSON.parse(userDataStr);
                displayEl.innerText = u.name || u.username || "Profilim";
            } catch(e) {}
        } else if (localStorage.getItem('fifa_user')) {
            displayEl.innerText = localStorage.getItem('fifa_user');
        }
    }
})();

function fifaCikisYap() {
    localStorage.clear();
    window.location.replace('login.html');
}
</script>
